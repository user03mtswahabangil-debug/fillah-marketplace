<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <h1>market place, prouct card</h1>
      <nav>
        <a href="#product">produk</a>
        <a>kontak</a>
        <a>keranjang</a>
      </nav>
    </header>
    <main>
       <div class="product-grid" id="product">

        <div class="product-card">
            <img src="gambar/kipas.jpg" alt="product image">
            <h3>kipas portable</h3>
            <p class="price">500.000</p>
            <div class="qty-steper">
                <button type="button" class="qty-btn">-</button>
                <Input type="text" value="1" value readonly/>
                <button>+</button>
            </div>
            <button type="button" class="qty-btn btn-plus">beli sekarang</button>
            
        </div>
<div class="product-card">
            <img src="gambar/kamera.jpg" alt="product image">
            <h3>kamera polaroid</h3>
            <p class="price">3,550,000</p>
            <div class="qty-steper">
                <button type="button" class="qty-btn">-</button>
                <Input type="text" value="1" value readonly/>
                <button>+</button>
            </div>
            <button type="button" class="qty-btn btn-plus">beli sekarang</button>
            
        </div>
            
        <div class="product-card">
            <img src="gambar/jam.jpg" alt="product image">
            <h3>jam tangan</h3>
            <p class="price">2,792,000</p>
            <div class="qty-steper">
                <button type="button" class="qty-btn">-</button>
                <Input type="text" value="1" value readonly/>
                <button>+</button>
            </div>
            <button type="button" class="qty-btn btn-plus">beli sekarang</button>
            
        </div>
    
        <div class="product-card">
            <img src="gambar/ear ph.jpg" alt="product image">
            <h3>ear phone</h3>
            <p class="price">1,000,000</p>
            <div class="qty-steper">
                <button type="button" class="qty-btn">-</button>
                <Input type="text" value="1" value readonly/>
                <button>+</button>
            </div>
            <button type="button" class="qty-btn btn-plus">beli sekarang</button>
            
        </div>
          
        <div class="product-card">
            <img src="gambar/hp.jpg" alt="product image">
            <h3>hand phone</h3>
            <p class="price">5,310,000</p>
            <div class="qty-steper">
                <button type="button" class="qty-btn">-</button>
                <Input type="text" value="1" value readonly/>
                <button>+</button>
            </div>
            <button type="button" class="qty-btn btn-plus">beli sekarang</button>
            
        </div>
          
        <div class="product-card">
            <img src="gambar/key.jpg" alt="product image">
            <h3>keyboard</h3>
            <p class="price">250.000</p>
            <div class="qty-steper">
                <button type="button" class="qty-btn">-</button>
                <Input type="text" value="1" value readonly/>
                <button>+</button>
            </div>
            <button type="button" class="qty-btn btn-plus">beli sekarang</button>
            
        </div>
        
        <div class="product-card">
            <img src="gambar/tikus.jpg" alt="product image">
            <h3>mouse</h3>
            <p class="price">400.000</p>
            <div class="qty-steper">
                <button type="button" class="qty-btn">-</button>
                <Input type="text" value="1" class="qty-value" readonly/>
                <button>+</button>
            </div>
            <button type="button" class="qty-btn btn-plus">beli sekarang</button>
            
        </div>
      
       </div>  
    </main>
    <footer>
        <h2>hubungi kami</h2>
        <form class="kontak">
            <label for="nama">name</label>
            <input type="text"placeholder="isi nama lengkap"/>
            <label for="email" >email</label>
            <input type="email"placeholder="isi email aktif" />
            <label for="pesan">pesan:</label>
            <textarea
             type="text"
             placeholder="tulis pesan anda di sini"
             ></textarea>
        <p>copyright 2026 by filah aisyi</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
